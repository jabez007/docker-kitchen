name: Test 'install' Script

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - "install.sh"
      - ".install/**"
      - ".github/workflows/test-install-script.yml"
      - ".github/fixtures/**"
  schedule:
    # Run weekly to catch upstream changes
    - cron: "0 2 * * 0"
  workflow_dispatch:

jobs:
  test-components:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu:26.04
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:trixie
          - debian:bookworm
          - fedora:44
          - fedora:43
          - archlinux:latest
        component:
          - base
          - shell
          - go
          - node
          - python
          - editor
          - docker
          - config

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make install script executable
        run: chmod +x install.sh

      - name: Test component installation
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            --privileged \
            -e GITHUB_BRANCH="${{ github.head_ref || github.ref_name }}" \
            ${{ matrix.os }} \
            bash -c "
              set -e
              set -x  # Enable debug output
              
              # Install basic dependencies for the test
              if command -v apt >/dev/null 2>&1; then
                apt update && apt install -y sudo curl git
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y sudo curl git
              elif command -v pacman >/dev/null 2>&1; then
                pacman -Sy --noconfirm sudo curl git
              fi
              
              # Create a test user with proper home directory
              useradd -m -s /bin/bash testuser
              
              # Fedora-specific: Set a password for the user and configure PAM properly
              if command -v dnf >/dev/null 2>&1; then
                echo 'testuser:testpass' | chpasswd
                usermod -aG wheel testuser
                echo '%wheel ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
                chmod u+r /etc/shadow
              fi
              
              # Allow sudo without password
              echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              
              # Fix ownership of the workspace for testuser
              chown -R testuser:testuser /workspace
              
              # Ensure install.sh is executable
              chmod +x /workspace/install.sh
              
              # Run the installation as the test user
              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --debug ${{ matrix.component }}'

              # Verify installation based on component
              case '${{ matrix.component }}' in
                base)
                  command -v git && command -v curl && command -v rg
                  ;;
                go)
                  su - testuser -c 'bash -i -c \"command -v go && go version\"'
                  ;;
                node)
                  su - testuser -c 'bash -i -c \"command -v node && node --version\"'
                  su - testuser -c 'command -v deno && deno --version'
                  ;;
                python)
                  su - testuser -c 'bash -i -c \"command -v pyenv && pyenv --version\"'
                  # pyenv is cloned at a release tag, not master
                  su - testuser -c 'git -C ~/.pyenv describe --tags --exact-match'
                  ;;
                editor)
                  su - testuser -c 'command -v nvim && command -v lazygit && command -v btm'
                  ;;
                config)
                  su - testuser -c 'git config --global --list'
                  ;;
                shell)
                  su - testuser -c 'command -v fish && command -v tmux && command -v starship'
                  ;;
                docker)
                  command -v docker && docker --version
                  ;;
              esac
            "

  test-combinations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-case:
          - components: "base go"
            os: "ubuntu:24.04"
          - components: "base shell"
            os: "debian:bookworm"
          - components: "base node editor"
            os: "fedora:44"
          - components: "all"
            os: "ubuntu:22.04"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make install script executable
        run: chmod +x install.sh

      - name: Test component combinations
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            --privileged \
            -e GITHUB_BRANCH="${{ github.head_ref || github.ref_name }}" \
            ${{ matrix.test-case.os }} \
            bash -c "
              set -e
              set -x  # Enable debug output
              
              if command -v apt >/dev/null 2>&1; then
                apt update && apt install -y sudo curl git
              elif command -v dnf >/dev/null 2>&1; then
                dnf install -y sudo curl git
              elif command -v pacman >/dev/null 2>&1; then
                pacman -Sy --noconfirm sudo curl git
              fi
              
              useradd -m -s /bin/bash testuser
              
              # Fedora-specific: Set a password for the user and configure PAM properly
              if command -v dnf >/dev/null 2>&1; then
                echo 'testuser:testpass' | chpasswd
                usermod -aG wheel testuser
                echo '%wheel ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
                chmod u+r /etc/shadow
              fi
              
              echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              
              # Fix ownership and permissions
              chown -R testuser:testuser /workspace
              chmod +x /workspace/install.sh
              
              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --debug ${{ matrix.test-case.components }}'

              # exec fish ends .bashrc, so the Fish launcher must come after
              # what later components append (issue #35)
              if grep -q 'install.sh: launch fish' /home/testuser/.bashrc; then
                test \"\$(tail -n 1 /home/testuser/.bashrc)\" = '# <<< install.sh: launch fish <<<'
              fi
            "

  test-options:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make install script executable
        run: chmod +x install.sh

      - name: Test script options
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            -e GITHUB_BRANCH="${{ github.head_ref || github.ref_name }}" \
            ubuntu:22.04 \
            bash -c "
              set -e
              set -x  # Enable debug output
              
              apt update && apt install -y sudo curl git
              useradd -m -s /bin/bash testuser
              echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              
              # Fix ownership and permissions
              chown -R testuser:testuser /workspace
              chmod +x /workspace/install.sh
              
              # Test help option
              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --help'
              
              # Test save config
              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --save-config'
              
              # Test custom options
              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --debug --keep-git --tmux-session test base'
            "

  test-error-handling:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make install script executable
        run: chmod +x install.sh

      - name: Test error conditions
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            -e GITHUB_BRANCH="${{ github.head_ref || github.ref_name }}" \
            ubuntu:22.04 \
            bash -c "
              set -e
              set -x  # Enable debug output
              
              apt update && apt install -y sudo curl git
              useradd -m -s /bin/bash testuser
              echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              
              # Fix ownership and permissions
              chown -R testuser:testuser /workspace
              chmod +x /workspace/install.sh
              
              # Test invalid component (expect failure)
              ! su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh invalid-component'
              
              # Test missing argument (expect failure)
              ! su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --tmux-session'
              
              # Test no components (expect failure)
              ! su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh'
            "

  test-idempotency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make install script executable
        run: chmod +x install.sh

      - name: Test idempotency
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            -e GITHUB_BRANCH="${{ github.head_ref || github.ref_name }}" \
            ubuntu:22.04 \
            bash -c "
              set -e
              set -x  # Enable debug output
              
              apt update && apt install -y sudo curl git
              useradd -m -s /bin/bash testuser
              echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              
              # Fix ownership and permissions
              chown -R testuser:testuser /workspace
              chmod +x /workspace/install.sh
              
              # Start with the Fish launcher an older install.sh wrote (issue #35)
              cat .github/fixtures/legacy-fish-launcher.bashrc >> /home/testuser/.bashrc

              # Run twice to test idempotency
              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --debug base shell go'

              # The first run replaced the old launcher with one marked copy at the end
              test \"\$(grep -cxF '# Launch fish shell automatically unless bash was started from fish' /home/testuser/.bashrc)\" = 1
              test \"\$(tail -n 1 /home/testuser/.bashrc)\" = '# <<< install.sh: launch fish <<<'
              cp /home/testuser/.bashrc /tmp/bashrc.first

              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --debug base shell go'
              cmp /tmp/bashrc.first /home/testuser/.bashrc

              # A line added after the launcher ends up above it on the next run
              echo 'export ADDED_LATER=1' >> /home/testuser/.bashrc
              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --debug base'
              test \"\$(tail -n 1 /home/testuser/.bashrc)\" = '# <<< install.sh: launch fish <<<'
              test \"\$(grep -c '^# <<< install.sh: launch fish' /home/testuser/.bashrc)\" = 1
              grep -qx 'export ADDED_LATER=1' /home/testuser/.bashrc

              # bash -i -c runs its command instead of switching to Fish
              su - testuser -c 'bash -i -c \"echo still-bash\"' | tee /tmp/bash-i.log
              grep -qx still-bash /tmp/bash-i.log
            "

  test-upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test --upgrade
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            -e GITHUB_BRANCH="${{ github.head_ref || github.ref_name }}" \
            ubuntu:24.04 \
            bash -c "
              set -exo pipefail

              apt update && apt install -y sudo curl git
              useradd -m -s /bin/bash testuser
              echo 'testuser ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
              chown -R testuser:testuser /workspace
              chmod +x /workspace/install.sh

              # Start from an old Go so there is something to upgrade
              curl -fsSL https://go.dev/dl/go1.22.0.linux-amd64.tar.gz | tar -C /usr/local -xz
              echo 'export PATH=\$PATH:/usr/local/go/bin' >> /home/testuser/.profile

              # Without --upgrade, the old Go is left alone
              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --debug base go node editor' | tee /tmp/install.log
              grep -q 'Go go1.22.0 already installed' /tmp/install.log

              # With --upgrade, Go moves to the latest release and current tools are skipped
              su - testuser -c 'cd /workspace && GITHUB_BRANCH=\"${{ github.head_ref || github.ref_name }}\" ./install.sh --debug --upgrade go node editor' | tee /tmp/upgrade.log
              grep -q 'Upgrading Go from go1.22.0' /tmp/upgrade.log
              # (set -e ignores a pipeline negated with !, so check explicitly)
              if su - testuser -c 'go version' | grep -q go1.22.0; then exit 1; fi
              for tool in Neovim LazyGit Bottom NVM Node.js Deno; do
                grep -q \"\$tool .* is up to date\" /tmp/upgrade.log
              done
            "

  lint-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint bash scripts
        run: |
          shellcheck -x -S warning install.sh .install/lib/*.sh .install/modules/*.sh

      - name: Check script syntax
        run: |
          for f in install.sh .install/lib/*.sh .install/modules/*.sh; do bash -n "$f"; done

      - name: Test verify_sha256
        shell: bash
        run: |
          set -u
          declare -A CONFIG=()
          source .install/lib/utils.sh
          printf 'hello\n' > /tmp/sample
          good=$(sha256sum /tmp/sample | cut -d' ' -f1)
          other=$(printf 'bye\n' | sha256sum | cut -d' ' -f1)

          # Matches pass, in either case
          (verify_sha256 /tmp/sample "$good")
          (verify_sha256 /tmp/sample "${good^^}")

          # A wrong, empty or malformed checksum stops the run
          for bad in "$other" "" "not-a-hash" "${good:0:63}"; do
            if (verify_sha256 /tmp/sample "$bad"); then
              echo "verify_sha256 accepted '$bad'"
              exit 1
            fi
          done
