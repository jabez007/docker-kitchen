name: Run Shared Build and Push Workflow for astro-nvim

on:
  push:
    branches:
      - main
      - master
    paths:
      - "astro-nvim/Dockerfile"
      - "astro-nvim/*.conf"
      - "astro-nvim/**/*.sh"
      - "install.sh"
      - ".install/**"
      - ".github/shared/docker/**"
      - ".github/shared/ghcr/**"
      - ".github/workflows/build-and-push-astro-nvim.yml"
  schedule:
    # Run weekly to catch upstream changes
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  IMAGE_NAME: astro-nvim

jobs:
  build_and_push_to_docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: See which repo we just cloned
        if: ${{ vars.pipeline_debug == 'true' }}
        run: ls -alh
        shell: bash

      - name: Build and push to DockerHub
        uses: ./.github/shared/docker
        with:
          context: ./astro-nvim
          # install.sh and .install/ come from the repo root
          build-contexts: |
            setup=.
          image-name: ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          description: A portable installation of AstroNvim configured with a few community language packs
          tag: latest
          platforms: linux/amd64,linux/arm64
          push: true
          debug: ${{ vars.pipeline_debug }}
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_TOKEN }}

  build_and_push_to_ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required if push is true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: See which repo we just cloned
        if: ${{ vars.pipeline_debug == 'true' }}
        run: ls -alh
        shell: bash

      - name: Build and push to GHCR
        uses: ./.github/shared/ghcr
        with:
          context: ./astro-nvim
          # install.sh and .install/ come from the repo root
          build-contexts: |
            setup=.
          image-name: jabez007/${{ env.IMAGE_NAME }}
          description: A portable installation of AstroNvim configured with a few community language packs
          tag: latest
          platforms: linux/amd64,linux/arm64
          push: true
          debug: ${{ vars.pipeline_debug }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
