# Settings install.sh reads when building the astro-nvim image (the Dockerfile
# passes this file with --config).
# Only the keys listed in .install/lib/config.sh (CONFIG_KEYS) have any effect.
#
# SYSTEM_WIDE is deliberately not set here: the root build step passes
# --system-wide, and the user step (running as the unprivileged dev user)
# must install into $HOME.

# Don't keep .git directories to reduce image size
KEEP_GIT=false

# Log level (DEBUG, INFO, WARN, ERROR)
LOG_LEVEL=DEBUG

# Use 'main' as default tmux session for containers
TMUX_SESSION="main"

# Use a minimal starship preset for containers
STARSHIP_PRESET="plain-text-symbols"

# AstroNvim configuration repository
ASTRONVIM_REPO="https://github.com/jabez007/AstroNvim-config.git"
