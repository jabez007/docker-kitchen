services:
  nvim-dev:
    build:
      context: .
      # install.sh and .install/ come from the repo root (see the Dockerfile)
      additional_contexts:
        setup: ..
    container_name: nvim-dev-container
    volumes:
      # Persist plugins, state and cache
      - nvim-share:/home/dev/.local/share/nvim
      - nvim-state:/home/dev/.local/state/nvim
      - nvim-cache:/home/dev/.cache/nvim

      # The project to edit (defaults to this repo)
      - ${WORKSPACE:-..}:/home/dev/workspace

    working_dir: /home/dev/workspace
    stdin_open: true
    tty: true
    environment:
      - TERM=xterm-256color

    # Optional: expose ports if needed
    # ports:
    #   - "8080:8080"  # For web development
    #   - "3000:3000"  # For Node.js apps

volumes:
  nvim-share:
  nvim-state:
  nvim-cache:
